<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CF0"/>
      <stop offset="1" stop-color="#5B3ED0"/>
    </linearGradient>
    <clipPath id="keys">
      <rect x="112" y="352" width="288" height="96" rx="16"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- keyboard -->
  <rect x="112" y="352" width="288" height="96" rx="16" fill="#FCFAF5"/>
  <g clip-path="url(#keys)">
    <g stroke="#2A2433" stroke-width="3" opacity="0.85">
      <line x1="153.1" y1="352" x2="153.1" y2="448"/>
      <line x1="194.3" y1="352" x2="194.3" y2="448"/>
      <line x1="235.4" y1="352" x2="235.4" y2="448"/>
      <line x1="276.6" y1="352" x2="276.6" y2="448"/>
      <line x1="317.7" y1="352" x2="317.7" y2="448"/>
      <line x1="358.9" y1="352" x2="358.9" y2="448"/>
    </g>
    <g fill="#2A2433">
      <rect x="140.1" y="352" width="26" height="60" rx="6"/>
      <rect x="181.3" y="352" width="26" height="60" rx="6"/>
      <rect x="263.6" y="352" width="26" height="60" rx="6"/>
      <rect x="304.7" y="352" width="26" height="60" rx="6"/>
      <rect x="345.9" y="352" width="26" height="60" rx="6"/>
    </g>
  </g>

  <!-- quarter note (clean primitives, no hand-drawn path) -->
  <g fill="#FFB627">
    <rect x="292" y="120" width="20" height="192" rx="10"/>
    <ellipse cx="248" cy="300" rx="50" ry="37" transform="rotate(-20 248 300)"/>
  </g>
</svg>
